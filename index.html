<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owners Alliance | The Verified Minecraft Server Owners Network</title>
  <meta name="description" content="Owners Alliance (OA) is the premier verified Discord community for Minecraft server owners, developers, builders, and staff. Safe networking, vetted recruitment, and exploit advisories." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       CSS Variables & Reset
       ========================================================================== */
    :root {
      --bg-dark: #080a10;
      --bg-card: rgba(18, 22, 34, 0.75);
      --bg-card-hover: rgba(26, 32, 50, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(88, 101, 242, 0.4);

      --discord: #5865F2;
      --discord-hover: #4752c4;
      --accent-cyan: #00d2ff;
      --accent-gold: #f59e0b;
      --accent-emerald: #10b981;

      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-normal: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.22;
    }

    .glow-1 {
      top: -100px;
      left: 15%;
      background: radial-gradient(circle, var(--discord) 0%, transparent 70%);
    }

    .glow-2 {
      top: 35%;
      right: 5%;
      background: radial-gradient(circle, var(--accent-cyan) 0%, transparent 70%);
      opacity: 0.15;
    }

    .glow-3 {
      bottom: 10%;
      left: 10%;
      background: radial-gradient(circle, #7928ca 0%, transparent 70%);
      opacity: 0.18;
    }

    /* Grid pattern overlay */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      pointer-events: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Typography Utilities */
    h1, h2, h3, h4 {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ffffff 20%, #94a3b8 60%, var(--discord) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-text-cyan {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================================================
       Navigation
       ========================================================================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(8, 10, 16, 0.7);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      align-items: center;
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--discord) 0%, #3b429f 100%);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color var(--transition-fast);
    }

    .nav-link:hover {
      color: #fff;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition-normal);
      white-space: nowrap;
    }

    .btn-discord {
      background: var(--discord);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.35);
    }

    .btn-discord:hover {
      background: var(--discord-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(88, 101, 242, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
      color: var(--text-main);
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* Mobile toggle */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* ==========================================================================
       Hero Section
       ========================================================================== */
    .hero {
      padding: 170px 0 100px;
      text-align: center;
      position: relative;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(88, 101, 242, 0.12);
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }

    .hero-title {
      font-size: clamp(2.5rem, 5.5vw, 4.4rem);
      line-height: 1.1;
      font-weight: 800;
      max-width: 960px;
      margin: 0 auto 24px;
    }

    .hero-subtitle {
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      color: var(--text-muted);
      max-width: 720px;
      margin: 0 auto 40px;
      line-height: 1.7;
    }

    .hero-cta-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 60px;
    }

    /* Community Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      max-width: 1040px;
      margin: 0 auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .stat-item {
      text-align: center;
      border-right: 1px solid var(--border-color);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* ==========================================================================
       Features / Core Pillars
       ========================================================================== */
    .section {
      padding: 100px 0;
    }

    .section-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 60px;
    }

    .section-tag {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      display: inline-block;
    }

    .section-title {
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      margin-bottom: 16px;
    }

    .section-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 36px 28px;
      transition: all var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--discord), transparent);
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .feature-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      transform: translateY(-6px);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
    }

    .feature-card:hover::before {
      opacity: 1;
    }

    .feature-icon-box {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      background: rgba(88, 101, 242, 0.12);
      border: 1px solid rgba(88, 101, 242, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      color: #818cf8;
    }

    .feature-icon-box svg {
      width: 26px;
      height: 26px;
    }

    .feature-title {
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    .feature-text {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* ==========================================================================
       Roles / Community Showcase
       ========================================================================== */
    .roles-section {
      background: linear-gradient(180deg, transparent 0%, rgba(18, 22, 34, 0.5) 50%, transparent 100%);
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .role-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 30px 24px;
      text-align: center;
      transition: transform var(--transition-normal);
    }

    .role-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .role-badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
    }

    .role-name {
      font-size: 1.15rem;
      margin-bottom: 8px;
    }

    .role-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       Verification Pipeline
       ========================================================================== */
    .steps-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      position: relative;
    }

    .step-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 32px 24px;
      position: relative;
    }

    .step-number {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: rgba(88, 101, 242, 0.4);
      margin-bottom: 12px;
    }

    .step-title {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .step-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       Security & Trust Banner
       ========================================================================== */
    .trust-card {
      background: radial-gradient(circle at top right, rgba(88, 101, 242, 0.15), transparent 60%), var(--bg-card);
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: var(--radius-lg);
      padding: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .trust-content {
      max-width: 620px;
    }

    .trust-title {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    .trust-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .trust-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .trust-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ==========================================================================
       FAQ Accordion
       ========================================================================== */
    .faq-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .faq-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      overflow: hidden;
      transition: border-color var(--transition-fast);
    }

    .faq-item.active {
      border-color: var(--border-highlight);
    }

    .faq-question {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 22px 28px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: inherit;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .faq-icon {
      font-size: 1.4rem;
      color: var(--text-muted);
      transition: transform var(--transition-normal);
    }

    .faq-item.active .faq-icon {
      transform: rotate(45deg);
      color: var(--discord);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition-normal);
      padding: 0 28px;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .faq-item.active .faq-answer {
      max-height: 300px;
      padding-bottom: 22px;
    }

    /* ==========================================================================
       CTA Card
       ========================================================================== */
    .cta-box {
      text-align: center;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.15) 0%, rgba(0, 210, 255, 0.1) 100%), var(--bg-card);
      border: 1px solid rgba(88, 101, 242, 0.35);
      border-radius: var(--radius-lg);
      padding: 70px 32px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .cta-box h2 {
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      margin-bottom: 16px;
    }

    .cta-box p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 580px;
      margin: 0 auto 36px;
    }

    /* ==========================================================================
       Footer
       ========================================================================== */
    .footer {
      border-top: 1px solid var(--border-color);
      padding: 60px 0 30px;
      margin-top: 60px;
      background: rgba(5, 7, 11, 0.95);
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 30px;
    }

    .footer-brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 320px;
      margin-top: 12px;
    }

    .footer-links {
      display: flex;
      gap: 40px;
    }

    .footer-col h5 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: #fff;
    }

    .footer-col ul {
      list-style: none;
    }

    .footer-col li {
      margin-bottom: 10px;
    }

    .footer-col a {
      color: var(--text-muted);
      font-size: 0.88rem;
      transition: color var(--transition-fast);
    }

    .footer-col a:hover {
      color: #fff;
    }

    .footer-bottom {
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-dim);
      font-size: 0.82rem;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--discord);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ==========================================================================
       Responsive Media Queries
       ========================================================================== */
    @media (max-width: 992px) {
      .features-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .roles-grid, .steps-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .trust-card {
        flex-direction: column;
        text-align: center;
      }
      .trust-tags {
        justify-content: center;
      }
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .stat-item:nth-child(2) {
        border-right: none;
      }
      .stat-item:nth-child(1), .stat-item:nth-child(2) {
        borde
